---
- name: Create staging folders
  ansible.builtin.file:
    path: "{{ dest }}"
    state: directory
    mode: '0755'

- name: Create vmware-system-csi k8s namespace
  kubernetes.core.k8s:
    name: vmware-system-csi
    api_version: v1
    kind: Namespace
    state: present

- name: Download files to host
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ dest }}"
    mode: '0644'
  loop:
    - vsphere-ccm.yaml
    - vsphere-csi-driver.yaml
    - vsphere-csi-storageclass.yaml
    - vc-root-ca-cert-csi.yaml
    - vc-root-ca-cert-ccm.yaml

- name: Create templated files
  ansible.builtin.template:
    src: "{{ csi_item }}.j2"
    dest: "{{ dest }}{{ csi_item }}"
    mode: '0644'
  loop:
    - vsphere-cloud-secret.yaml
    - vsphere-cloud-config.yaml
    - csi-vsphere.conf
  loop_control:
    loop_var: csi_item

- name: Read csi-vsphere.conf
  ansible.builtin.slurp:
    src: "{{ dest }}csi-vsphere.conf"
  register: vsphere_csi_conf

- name: Create secret from csi-vsphere.conf
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: vsphere-config-secret
        namespace: vmware-system-csi
      type: Opaque
      data:
        csi-vsphere.conf: "{{ vsphere_csi_conf.content }}"

- name: Deploy vsphere-csi manifests
  kubernetes.core.k8s:
    src: "{{ dest }}{{ item }}"
    state: present
  loop:
    - vsphere-cloud-secret.yaml
    - vsphere-ccm.yaml
    - vsphere-csi-driver.yaml
    - vsphere-cloud-config.yaml
    - vsphere-csi-storageclass.yaml
    - vc-root-ca-cert-csi.yaml
    - vc-root-ca-cert-ccm.yaml

- name: Set vsphere-csi as default storageclass
  when: k8s_dist != "rke2"
  ansible.builtin.shell: |
    set -eou pipefail
    storageclass_list=$(kubectl get storageclass | grep '(default)' | cut -d ' ' -f 1)
    CURRENT_IFS=$IFS
    IFS=$'\n' read -r -d '' -a array <<< "$storageclass_list"
    IFS=$CURRENT_IFS

    for (( i=0; i<${{ "{" }}{{ "#" }}array[@]}; i++ )) do
      if [ "${array[$i]}" != "vsphere-csi" ]; then
          kubectl patch storageclass "${array[$i]}" -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"false"}}}'
        fi
    done
    kubectl patch storageclass vsphere-csi -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
  args:
    executable: /bin/bash
  register: vsphere_csi_patch_result
  changed_when: vsphere_csi_patch_result.stdout != ""

- name: Debug patch result
  when: vsphere_csi_patch_result.stdout is defined
  ansible.builtin.debug:
    msg: "{{ vsphere_csi_patch_result.stdout }}"
