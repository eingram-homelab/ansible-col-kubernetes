apiVersion: v1
kind: Secret
metadata:
  name: ycd-rke2-argocd
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    environment: "dev"
type: Opaque
stringData:
  name: ycd-rke2
  server: "https://ycd-rke2.ycdisp.net:6443"
  config: |
    {
      "bearerToken": "{{ lookup('hashi_vault', 'secret=secret/ssh/ansible:ssh_password_bcrypt') }}",
      "tlsClientConfig": {
        "insecure": false,
        "caData": ""
      }
    }

      
